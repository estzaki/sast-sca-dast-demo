stages:
  - test
  - dast

variables:
  GIT_DEPTH: "0"

# --- SAST: SonarQube ---
sast_sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - sonar-scanner
        -Dsonar.host.url="${SONAR_HOST_URL}"
        -Dsonar.token="${SONAR_TOKEN}"
        -Dsonar.projectKey="Vulnerable-Flask-App"
        -Dsonar.sources="vulnerable_flask_app"
        -Dsonar.qualitygate.wait=true
  allow_failure: true

# --- SCA: pip-audit ---
sca_pip_audit:
  stage: test
  image: python:3.9-slim
  script:
    - set +e
    - python -m pip install --upgrade pip
    - pip install pip-audit
    - pip-audit -r vulnerable_flask_app/requirements.txt
    - AUDIT_EXIT=$?
    - echo "pip-audit exited with status ${AUDIT_EXIT}"
    - if [ $AUDIT_EXIT -eq 1 ]; then echo "Vulnerabilities detected as expected in lab."; fi
    - exit 0
  allow_failure: true

# --- DAST: OWASP ZAP Fast Automated Scan ---
dast_zap_scan:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  before_script:
    - mkdir -p /zap/wrk
  script:
    # -m 1: Spider max 1 minute
    # -D 0: No passive scanning delay
    # -I: Treat warnings as non-fatal
    # -z: Limit active scan to 1 minute total so it never hangs
    - zap-full-scan.py -t http://192.168.1.30:5000 -m 1 -D 0 -I -r /zap/wrk/report.html -J /zap/wrk/report.json -x /zap/wrk/report.xml -z "-config scanner.maxScanDurationInMins=1"
    - cp /zap/wrk/report.* . || true
  artifacts:
    name: "zap-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 5 days
    paths:
      - report.html
      - report.json
      - report.xml
  allow_failure: true
