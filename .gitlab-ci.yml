stages:
  - test
  - dast

variables:
  GIT_DEPTH: "0"

# --- SAST: SonarQube ---
sast_sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - sonar-scanner
        -Dsonar.host.url="${SONAR_HOST_URL}"
        -Dsonar.token="${SONAR_TOKEN}"
        -Dsonar.projectKey="Vulnerable-Flask-App"
        -Dsonar.sources="vulnerable_flask_app"
        -Dsonar.qualitygate.wait=true
  allow_failure: true

# --- SCA: pip-audit ---
sca_pip_audit:
  stage: test
  image: python:3.9-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install pip-audit
  script:
    - pip-audit -r vulnerable_flask_app/requirements.txt
  allow_failure: true

# --- DAST: OWASP ZAP Automated Scan ---
dast_zap_scan:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  before_script:
    - mkdir -p zap_reports
    - chmod 777 zap_reports
  script:
    - zap-full-scan.py -t http://192.168.1.30:5000 -I -j -r report.html -J report.json -x report.xml -a
  after_script:
    - cp /zap/wrk/report.* zap_reports/ || true
  artifacts:
    name: "zap-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 5 days
    paths:
      - zap_reports/
      - /zap/wrk/report.html
      - /zap/wrk/report.json
  allow_failure: true

